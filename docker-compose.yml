# ============================================================
# docker-compose.yml — Phase 2: Local Testing
# Run locally with: docker-compose up --build
# ============================================================

version: "3.9"

services:
  flask-app:
    # Build image from local Dockerfile inside ./app
    build:
      context: ./app
      dockerfile: Dockerfile

    # Map host port 5000 → container port 5000
    ports:
      - "5000:5000"

    # Restart container automatically if it crashes
    restart: unless-stopped

    # Environment variables (override in .env for secrets)
    environment:
      - FLASK_ENV=production
