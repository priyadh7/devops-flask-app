# ============================================================
# .github/workflows/deploy.yml — Phase 6: CI/CD Pipeline
# Trigger: Push to main branch
# Steps: Build Docker image → Run tests → Deploy summary
# ============================================================

name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Test, Deploy
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Checkout source code ──────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Step 2: Set up Python ─────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── Step 3: Install dependencies ──────────────────────
      - name: Install Dependencies
        run: pip install -r app/requirements.txt

      # ── Step 4: Test the Flask app ────────────────────────
      - name: Test Flask App
        run: |
          cd app
          python -c "
          from app import app
          client = app.test_client()
          r = client.get('/')
          assert r.status_code == 200, 'GET / failed'
          r = client.post('/', data={'user_input': 'hello'})
          assert b'HELLO' in r.data, 'POST / failed'
          print('All tests passed')
          "

      # ── Step 5: Build Docker image ────────────────────────
      - name: Build Docker Image
        run: |
          docker build -t flask-app:${{ github.sha }} ./app
          docker build -t flask-app:latest ./app

      # ── Step 6: Verify Docker image ───────────────────────
      - name: Verify Docker Image
        run: |
          docker images | grep flask-app
          docker run --rm -d -p 5000:5000 --name test-container flask-app:latest
          sleep 3
          curl -f http://localhost:5000 && echo "Container is healthy"
          docker stop test-container

      # ── Step 7: Deployment Summary ────────────────────────
      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "  DEPLOYMENT SUMMARY"
          echo "============================================"
          echo "  Image   : flask-app:latest"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Status  : Ready for Kubernetes deploy"
          echo "  K8s cmd : kubectl apply -f k8s/"
          echo "============================================"
