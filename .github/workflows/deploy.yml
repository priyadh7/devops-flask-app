# ============================================================
# .github/workflows/deploy.yml — Phase 6: CI/CD Pipeline
# Trigger: Push to main branch
# Steps: Build Docker image → Push to GHCR → Deploy summary
# ============================================================

name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: flask-app
  REGISTRY: ghcr.io
  IMAGE_FULL: ghcr.io/${{ github.repository_owner }}/flask-app

jobs:
  build-and-deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Checkout source code ──────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Step 2: Log in to GitHub Container Registry ───────
      # Uses built-in GITHUB_TOKEN — no secrets needed
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 3: Build Docker image ─────────────────────────
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ env.IMAGE_FULL }}:${{ github.sha }} \
            -t ${{ env.IMAGE_FULL }}:latest \
            ./app

      # ── Step 4: Push image to GitHub Container Registry ───
      - name: Push Image to GHCR
        run: |
          docker push ${{ env.IMAGE_FULL }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FULL }}:latest

      # ── Step 5: Verify image was pushed ───────────────────
      - name: Verify Image
        run: |
          echo "✅ Image pushed: ${{ env.IMAGE_FULL }}:${{ github.sha }}"
          docker images | grep flask-app

      # ── Step 6: Simulate Kubernetes deployment ─────────────
      # In production this would run: kubectl apply -f k8s/
      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "  DEPLOYMENT SUMMARY"
          echo "============================================"
          echo "  Image   : ${{ env.IMAGE_FULL }}:latest"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Status  : ✅ Ready for Kubernetes deploy"
          echo "  K8s cmd : kubectl apply -f k8s/"
          echo "============================================"
